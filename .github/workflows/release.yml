name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0). Leave empty to use latest tag.'
        required: false
        type: string
      force:
        description: 'Force overwrite existing release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  setup:
    name: Setup Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "::error::No tag found. Please specify a tag or create one first."
              exit 1
            fi
          fi
          echo "Resolved tag: $TAG"
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not exist. Create it first: git tag $TAG && git push origin $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing release (if force)
        if: steps.check.outputs.exists == 'true' && (github.event_name == 'workflow_dispatch' && inputs.force || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          echo "Deleting existing release $TAG..."
          gh release delete "$TAG" --yes || true
          echo "Existing release deleted"

  test:
    name: Test
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test -race ./...

  build-binaries:
    name: Binary ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [setup, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    env:
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/pkg
          go build -trimpath \
            -ldflags "-s -w -X github.com/tentens-tech/gomcrouter/version.Version=${RELEASE_TAG}" \
            -o dist/pkg/gomcrouter .
          cp LICENSE README.md dist/pkg/ 2>/dev/null || true

      - name: Package binary
        working-directory: dist
        run: |
          ARCHIVE="gomcrouter-${RELEASE_TAG}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE" -C pkg .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          rm -rf pkg
          ls -la

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  build-docker-amd64:
    name: Docker amd64
    needs: [setup, test]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}-amd64
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-docker-arm64:
    name: Docker arm64
    needs: [setup, test]
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}-arm64
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  docker-manifest:
    name: Docker Manifest
    needs: [setup, build-docker-amd64, build-docker-arm64]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push version manifest
        run: |
          echo "Creating manifest for: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RELEASE_TAG"
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RELEASE_TAG \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RELEASE_TAG-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RELEASE_TAG-arm64

      - name: Create and push latest manifest
        run: |
          echo "Creating manifest for: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RELEASE_TAG-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RELEASE_TAG-arm64

  release:
    name: Create Release
    needs: [setup, docker-manifest, build-binaries]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.tag }}
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: Generate combined checksums
        working-directory: binaries
        run: |
          ls -la
          # drop per-artifact checksum files, make a single aggregate one
          rm -f *.sha256
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+" | grep -vx "$RELEASE_TAG" | head -1 || echo "")

          cat > release_notes.md << NOTES
          A high-performance memcached router written in Go.

          ### 📦 Docker Image

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:$RELEASE_TAG
          \`\`\`

          Supported architectures: \`linux/amd64\`, \`linux/arm64\`.

          ### 📥 Binaries

          Prebuilt static binaries (CGO disabled) are attached to this release:

          - \`gomcrouter-$RELEASE_TAG-linux-amd64.tar.gz\`
          - \`gomcrouter-$RELEASE_TAG-linux-arm64.tar.gz\`
          - \`checksums.txt\` (SHA-256)

          \`\`\`bash
          curl -L -o gomcrouter.tar.gz \\
            https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/gomcrouter-$RELEASE_TAG-linux-amd64.tar.gz
          tar -xzf gomcrouter.tar.gz
          ./gomcrouter --help
          \`\`\`

          ### 🚀 Quick Start

          \`\`\`bash
          docker run --rm -p 8080:8080 -p 9090:9090 \\
            -v \$(pwd)/gomcrouter.yaml:/gomcrouter.yaml \\
            ghcr.io/${{ github.repository }}:$RELEASE_TAG \\
            /bin/gomcrouter -f /gomcrouter.yaml
          \`\`\`

          See \`examples/docker/\` in the repository for a full docker-compose
          setup with two memcached nodes, a writer, and a metrics watcher.

          ### 🔧 What's Changed

          NOTES

          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$RELEASE_TAG" ]; then
            echo "Changes since $PREVIOUS_TAG:" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..$RELEASE_TAG --no-merges >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi

          cat >> release_notes.md << NOTES

          ### 📚 Documentation

          - [README](https://github.com/${{ github.repository }}#readme)
          - [Benchmarks](https://github.com/${{ github.repository }}/blob/main/BENCHMARKS.md)
          - [Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

          NOTES

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: gomcrouter ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: |
            binaries/*.tar.gz
            binaries/checksums.txt
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
